name: untitled1
description: "A new Flutter project with Riverpod state management."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # ui Icons
  cupertino_icons: ^1.0.8

  # State Management (Riverpod)
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.6

  # Database
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4
  path: ^1.9.0

  # Firebase
  firebase_core: ^3.12.1

  # Formatting & Localization
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linter
  flutter_lints: ^6.0.0

  # Code Generation for Riverpod
  riverpod_generator: ^4.0.9
  build_runner: ^2.16.1

flutter:
  uses-material-design: true

  assets:
    - asserts/images/
